name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm run build

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t utilityhub-miniapp:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 3000:3000 \
            -e API_BASE_URL=https://dvsy-utility-backend-rk9l58-56f94b-13-140-149-47.sslip.io \
            utilityhub-miniapp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS -D - http://localhost:3000/ -o /dev/null | grep -i '^content-security-policy:'
          docker logs app
